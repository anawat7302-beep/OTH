<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTH 823 - TRAIN DRIVER LOTTERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700;
            --gold-glow: #ffaa00;
            --red: #d62828;
            --dark: #0f0f11;
            --panel: #1a1a1e;
            --border: #333339;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        
        body {
            background-color: var(--dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .logo { font-size: 1.2rem; letter-spacing: 4px; color: var(--red); font-weight: bold; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
        }

        .wheel-section {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .wheel-outer {
            position: relative;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 8px solid var(--gold);
            box-shadow: 0 0 20px var(--gold-glow), inset 0 0 15px #000;
            margin-bottom: 20px;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--red);
            z-index: 10;
            filter: drop-shadow(0 2px 4px #000);
        }

        canvas { width: 100%; height: 100%; border-radius: 50%; }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
